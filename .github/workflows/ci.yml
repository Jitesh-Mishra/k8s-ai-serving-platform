name: CI
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6390:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
  kind-smoke:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t aiserve:dev .
      - run: mkdir -p /tmp/models
      - uses: helm/kind-action@v1
        with: {config: deploy/kind.yaml, cluster_name: ai}
      - run: kind load docker-image aiserve:dev --name ai
      - name: helm install (no monitoring stack, no LLM)
        run: |
          helm lint charts/aiserve
          helm upgrade --install aiserve charts/aiserve -n ai --create-namespace -f deploy/aiserve-ci.yaml \
            --set monitoring.serviceMonitors=false --set monitoring.dashboard=false --set llm.enabled=false --wait --timeout 8m
          kubectl -n ai get pods
      - name: smoke test through the gateway
        run: |
          ROW=$(python3 -c "import json;print(json.dumps({'rows':json.load(open('data/sample_features.json'))['rows'][:2]}))")
          curl -sf -X POST localhost:30080/v1/eta -H 'X-API-Key: key-bench' -H 'content-type: application/json' -d "$ROW"
          JOB=$(curl -sf -X POST localhost:30080/v1/batch -H 'X-API-Key: key-bench' -H 'content-type: application/json' -d "$ROW" | python3 -c "import sys,json;print(json.load(sys.stdin)['job_id'])")
          for i in $(seq 1 30); do curl -sf localhost:30080/v1/batch/$JOB -H 'X-API-Key: key-bench' | grep -q '"done":true' && break; sleep 1; done
          curl -sf localhost:30080/v1/batch/$JOB -H 'X-API-Key: key-bench' | grep '"done":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:30080/v1/eta -H 'X-API-Key: wrong' -H 'content-type: application/json' -d "$ROW")" = 401
