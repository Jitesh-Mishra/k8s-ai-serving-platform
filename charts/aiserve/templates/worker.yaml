apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, labels: {app: worker}}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: {{ include "aiserve.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [python, -m, aiserve.worker]
          env:
            {{- include "aiserve.podEnv" . | nindent 12 }}
            - {name: WORK_MS, value: {{ .Values.worker.workMs | quote }}}
            - {name: CLAIM_IDLE_MS, value: {{ .Values.worker.claimIdleMs | quote }}}
          ports: [{name: metrics, containerPort: 9100}]
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: {name: worker, labels: {app: worker}}
spec:
  selector: {app: worker}
  ports: [{name: metrics, port: 9100, targetPort: 9100}]
