# Redis (job stream, token buckets, LLM idle state) and PostgreSQL (usage log, invoices, batch results)
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, labels: {app: redis}}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--appendonly", "yes", "--appendfsync", "everysec"]
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: [redis-cli, ping]}, periodSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec: {selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, labels: {app: postgres}}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_USER, value: aiserve}
            - {name: POSTGRES_PASSWORD, value: {{ .Values.postgres.password | quote }}}
            - {name: POSTGRES_DB, value: aiserve}
          ports: [{containerPort: 5432}]
          readinessProbe: {exec: {command: [pg_isready, -U, aiserve]}, periodSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
  type: NodePort
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432, nodePort: {{ .Values.postgres.nodePort }}}]
