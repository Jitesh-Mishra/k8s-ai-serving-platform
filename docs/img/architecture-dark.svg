<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620" role="img" aria-label="Tenants call one gateway on a kind Kubernetes cluster. The gateway enforces per-tenant quotas in Redis, routes to an autoscaled LightGBM ETA service, a scale-to-zero llama.cpp LLM, or a Redis Streams batch queue, and writes every request to PostgreSQL for billing. Prometheus, Grafana, the HPA and Argo Rollouts watch and change it."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9198a1"/></marker><marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker><marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker></defs><rect width="1080" height="620" rx="14" fill="#0d1117" stroke="#30363d"/><text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="start">One gateway, three serving paths, metered per tenant</text><text x="32" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">kind (Kubernetes in Docker) on a 4-vCPU CI runner; everything installed with Helm; CPU only.</text><rect x="28" y="110" width="150" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="103.0" y="181.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">tenants</text><text x="103.0" y="200.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">A (noisy, quota 50/s)</text><text x="103.0" y="216.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">B, C</text><text x="103.0" y="232.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">bench</text><rect x="206" y="92" width="600" height="500" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="222" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#9198a1" text-anchor="start">namespace ai</text><rect x="226" y="140" width="170" height="120" rx="10" fill="#13263d" stroke="#3987e5" stroke-width="1.5"/><text x="311.0" y="196.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">gateway</text><text x="311.0" y="215.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">API key -&gt; tenant</text><text x="311.0" y="231.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">token bucket quota</text><text x="311.0" y="247.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">metering, activator</text><line x1="178" y1="185" x2="222" y2="195" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><rect x="440" y="132" width="170" height="80" rx="10" fill="#0f2e23" stroke="#199e70" stroke-width="1.5"/><text x="525.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">eta</text><text x="525.0" y="187.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">LightGBM P50/P90</text><text x="525.0" y="203.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">HPA 1-6 pods</text><rect x="440" y="226" width="170" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="525.0" y="262.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">llm</text><text x="525.0" y="281.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">llama.cpp, Qwen2.5 0.5B</text><text x="525.0" y="297.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">scale to zero</text><rect x="440" y="320" width="170" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="525.0" y="356.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">worker x3</text><text x="525.0" y="375.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">Redis Streams group</text><text x="525.0" y="391.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">XAUTOCLAIM on crash</text><rect x="632" y="132" width="156" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="710.0" y="168.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">HPA</text><text x="710.0" y="187.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">RPS/pod (adapter)</text><text x="710.0" y="203.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">+ CPU</text><rect x="632" y="226" width="156" height="80" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="710.0" y="262.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">Argo Rollouts</text><text x="710.0" y="281.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">canary v1 -&gt; v2</text><text x="710.0" y="297.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">20% -&gt; 60% -&gt; 100%</text><rect x="226" y="440" width="170" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="311.0" y="496.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">redis</text><text x="311.0" y="515.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">quotas, job stream,</text><text x="311.0" y="531.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">LLM idle state</text><rect x="440" y="440" width="170" height="120" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="525.0" y="496.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="650" fill="#e6edf3" text-anchor="middle">postgres</text><text x="525.0" y="515.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">usage_log, invoices,</text><text x="525.0" y="531.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9198a1" text-anchor="middle">batch_results</text><line x1="396" y1="190" x2="436" y2="172" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><line x1="396" y1="210" x2="436" y2="262" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><path d="M311,260 L311,436" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M396,470 C416,470 416,372 436,372" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar)"/><path d="M380,260 L380,420 L420,420 L420,520 L436,520" fill="none" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="374" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9198a1" text-anchor="end">usage rows</text><line x1="525" y1="400" x2="525" y2="436" stroke="#9198a1" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ar)"/><text x="532" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#9198a1" text-anchor=