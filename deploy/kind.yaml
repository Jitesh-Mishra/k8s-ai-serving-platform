kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /tmp/models          # GGUF downloaded once on the host, mounted read-only into the LLM pod
        containerPath: /models
    extraPortMappings:
      - {containerPort: 30080, hostPort: 30080}   # gateway
      - {containerPort: 30090, hostPort: 30090}   # prometheus
      - {containerPort: 30030, hostPort: 30030}   # grafana
      - {containerPort: 30432, hostPort: 30432}   # postgres (usage log, invoices)
